<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Matrix</title>
    <!-- Import Roboto Flex from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
    
    <style>
        /* Global & Typography Resets */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto Flex', sans-serif;
            font-size: 11px;
            border-radius: 0px !important; /* Strict zero radius rule */
        }

        body {
            background-color: #ffffff;
            color: #000000;
            padding: 15px;
        }

        /* Swipeable horizontal scrolling container for mobile screen support */
        .responsive-table-box {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 1px solid #000000;
        }

        /* Strict Black & White Grid Design Elements */
        table.report-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: #ffffff;
        }

        table.report-table th, 
        table.report-table td {
            padding: 6px 10px;
            border: 1px solid #000000;
            white-space: nowrap;
        }

        table.report-table th {
            background-color: #000000;
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
        }

        table.report-table th:hover {
            background-color: #333333;
        }

        table.report-table tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        /* Stark Minimal Pagination UI Bar */
        .pagination-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            width: 100%;
        }

        .pagination-buttons {
            display: flex;
            gap: 5px;
        }

        .pagination-btn {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            padding: 4px 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .pagination-btn:hover:not(:disabled) {
            background-color: #000000;
            color: #ffffff;
        }

        .pagination-btn:disabled {
            border-color: #cccccc;
            color: #cccccc;
            cursor: not-allowed;
        }

        .page-indicator {
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- Target Data Grid Container -->
    <div class="responsive-table-box" id="targetArea"></div>
    
    <!-- Minimal Pagination Shell -->
    <div class="pagination-container" id="paginationControls"></div>

    <script>
    (function() {
        let masterRows = [];
        let ascending = Array(7).fill(true);
        const keys = ["ID", "Name", "Department", "Major", "Enrollment Date", "GPA", "Status"];
        
        // Dynamic Pagination Controls
        let currentPage = 1;

        // Function to determine page size on the fly based on browser viewport size
        function getRowsPerPage() {
            return window.matchMedia("(max-width: 768px)").matches ? 6 : 12;
        }

        function loadStudentData() {
            fetch("students.json")
                .then(res => res.ok ? res.json() : Promise.reject())
                .then(data => {
                    masterRows = data;
                    setupTableFramework();
                })
                .catch(() => console.error("Error: Could not locate students.json database layout."));
        }

        function setupTableFramework() {
            const target = document.getElementById('targetArea');
            if (!target) return;

            let headerCells = "";
            for (let i = 0; i < keys.length; i++) {
                headerCells += '<th data-index="' + i + '">' + keys[i] + ' ↕</th>';
            }

            target.innerHTML = `
                <table class="report-table">
                    <thead>
                        <tr>${headerCells}</tr>
                    </thead>
                    <tbody id="table-rows-body"></tbody>
                </table>`;

            target.querySelector('thead').addEventListener('click', (e) => {
                const th = e.target.closest('th');
                if (th) {
                    const index = parseInt(th.getAttribute('data-index'), 10);
                    sortColumn(index);
                }
            });

            // Listen for window resize/rotation events to seamlessly recalculate view bounds
            window.addEventListener('resize', renderTableAndPagination);

            renderTableAndPagination();
        }

        function renderTableAndPagination() {
            const tbody = document.getElementById('table-rows-body');
            const nav = document.getElementById('paginationControls');
            if (!tbody || !nav) return;

            const rowsPerPage = getRowsPerPage();
            const totalRows = masterRows.length;
            const totalPages = Math.ceil(totalRows / rowsPerPage) || 1;
            
            // Boundary Guarding
            if (currentPage > totalPages) currentPage = totalPages;
            if (currentPage < 1) currentPage = 1;

            const startIndex = (currentPage - 1) * rowsPerPage;
            const endIndex = startIndex + rowsPerPage;
            const pageSubset = masterRows.slice(startIndex, endIndex);

            // 1. Render Table Rows for Current Page
            tbody.innerHTML = pageSubset.map(row => `
                <tr>
                    <td>${row.ID ?? ''}</td>
                    <td><strong>${row.Name ?? ''}</strong></td>
                    <td>${row.Department ?? ''}</td>
                    <td>${row.Major ?? ''}</td>
                    <td>${row["Enrollment Date"] ?? ''}</td>
                    <td>${row.GPA !== undefined ? Number(row.GPA).toFixed(2) : ''}</td>
                    <td>${row.Status ?? ''}</td>
                </tr>
            `).join('');

            // 2. Render Functional Nav Controls Block
            nav.innerHTML = `
                <div class="page-indicator">Showing ${totalRows === 0 ? 0 : startIndex + 1}-${Math.min(endIndex, totalRows)} of ${totalRows}</div>
                <div class="pagination-buttons">
                    <button class="pagination-btn" id="prevBtn" ${currentPage === 1 ? 'disabled' : ''}>PREV</button>
                    <button class="pagination-btn" id="nextBtn" ${currentPage === totalPages ? 'disabled' : ''}>NEXT</button>
                </div>
            `;

            // 3. Attach Nav Event Listeners Dynamically
            document.getElementById('prevBtn').addEventListener('click', () => {
                currentPage--;
                renderTableAndPagination();
            });

            document.getElementById('nextBtn').addEventListener('click', () => {
                currentPage++;
                renderTableAndPagination();
            });
        }

        function sortColumn(index) {
            const key = keys[index];
            const isAsc = ascending[index];

            masterRows.sort((a, b) => {
                const valA = a[key] ?? '';
                const valB = b[key] ?? '';

                if (key === "GPA") return isAsc ? Number(valA) - Number(valB) : Number(valB) - Number(valA);
                return isAsc 
                    ? String(valA).localeCompare(String(valB), undefined, {numeric: true}) 
                    : String(valB).localeCompare(String(valA), undefined, {numeric: true});
            });

            ascending[index] = !isAsc;
            currentPage = 1; 
            renderTableAndPagination();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadStudentData);
        } else {
            loadStudentData();
        }
    })();
    </script>
</body>
</html>
